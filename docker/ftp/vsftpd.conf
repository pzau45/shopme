# vsftpd.conf — Deliberately vulnerable configuration for CTF lab
listen=YES
listen_ipv6=NO

# Allow anonymous login (CTF vulnerability)
anonymous_enable=YES
anon_upload_enable=YES
anon_mkdir_write_enable=YES
anon_other_write_enable=YES
no_anon_password=YES
anon_root=/srv/ftp

# Local user login
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=NO

# No SSL/TLS (cleartext — CTF vulnerability)
ssl_enable=NO
allow_anon_ssl=NO

# Banner that leaks info (CTF vulnerability)
ftpd_banner=ShopMe FTP Server v2.1 (vsftpd 3.0.3) - Internal Backup Storage
banner_file=/etc/vsftpd_banner

# Passive mode ports
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110

# No rate limiting (CTF vulnerability)
max_clients=100
max_per_ip=50

# Logging
xferlog_enable=YES
log_ftp_protocol=YES
vsftpd_log_file=/var/log/vsftpd.log

# Allow access to /
secure_chroot_dir=/var/run/vsftpd/empty
