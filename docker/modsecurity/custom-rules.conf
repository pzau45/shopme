# ─────────────────────────────────────────────────────────────────────────────
# ModSecurity WAF Custom Rules — ShopMe CTF Defense & Pentest Scanner Blocker
# ─────────────────────────────────────────────────────────────────────────────

# 1. Block Security Scanners & Pentest Tools by User-Agent
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(nmap|gobuster|nikto|sqlmap|dirbuster|hydra|wpscan|nessus|dirb|masscan|zgrab|acunetix|burpcollaborator|openvas|vega|netsparker|commix|ffuf|wfuzz)" \
    "id:1000001,phase:1,deny,status:403,log,msg:'[WAF BLOCKED] Pentest Tool or Security Scanner Detected: %{MATCHED_VAR}'"

# 2. Block Common Command Injection Signatures
SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_FILENAME|ARGS_NAMES|ARGS "@rx (?i)(;|\bcat\s+/etc/passwd\b|\bwhoami\b|\buname\s+-a\b|\bcurl\s+http|\bwget\s+http)" \
    "id:1000002,phase:2,deny,status:403,log,msg:'[WAF BLOCKED] Command Injection Pattern Detected'"

# 3. Block SQL Injection Signatures
SecRule ARGS_NAMES|ARGS|REQUEST_COOKIES "@rx (?i)(\bunion\s+select\b|\bselect\s+.*\s+from\s+users\b|\bdrop\s+table\b|' OR '1'='1|' OR 1=1)" \
    "id:1000003,phase:2,deny,status:403,log,msg:'[WAF BLOCKED] SQL Injection Signature Detected'"

# 4. Block Path Traversal Signatures
SecRule ARGS|REQUEST_URI "@rx (?i)(\.\.\/|\.\.\\|%2e%2e%2f|%2e%2e\/|\/etc\/passwd|\/etc\/shadow)" \
    "id:1000004,phase:2,deny,status:403,log,msg:'[WAF BLOCKED] Path Traversal Signature Detected'"
